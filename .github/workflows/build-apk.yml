name: Build APK

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    env:
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
      ANDROID_HOME: /usr/local/lib/android/sdk

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # The project can live at the repo root (android/ folder present)
      # or be uploaded as a zip. Either way we find it and export PROJECT_DIR.
      - name: Locate project
        run: |
          set -e
          if [ -f android/app/build.gradle.kts ]; then
            echo "PROJECT_DIR=$PWD" >> "$GITHUB_ENV"
            echo "Found project at repository root"
            exit 0
          fi

          ZIP="$(ls -1 *.zip 2>/dev/null | head -1 || true)"
          if [ -z "$ZIP" ]; then
            echo "::error::No android/ folder and no .zip file in the repository root. Upload voidxen-launcher.zip or the project files."
            ls -la
            exit 1
          fi

          echo "Extracting $ZIP"
          rm -rf /tmp/proj && mkdir -p /tmp/proj
          unzip -q -o "$ZIP" -d /tmp/proj

          FOUND="$(find /tmp/proj -maxdepth 6 -path '*/android/app/build.gradle.kts' -print -quit || true)"
          if [ -z "$FOUND" ]; then
            echo "::error::No android/app/build.gradle.kts inside $ZIP"
            find /tmp/proj -maxdepth 4 | head -40
            exit 1
          fi

          PROJ="$(dirname "$(dirname "$(dirname "$FOUND")")")"
          echo "PROJECT_DIR=$PROJ" >> "$GITHUB_ENV"
          echo "Project extracted to $PROJ"

      - name: Prepare Android SDK
        run: |
          set -e
          cd "$PROJECT_DIR"
          SDKMANAGER="$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then
            SDKMANAGER="$(find "$ANDROID_SDK_ROOT" -name sdkmanager -type f | head -1)"
          fi
          echo "sdkmanager: $SDKMANAGER"
          ( yes | "$SDKMANAGER" --licenses > /dev/null 2>&1 ) || true
          "$SDKMANAGER" "platform-tools" "platforms;android-34" "build-tools;34.0.0" > /dev/null 2>&1 || true
          mkdir -p android
          echo "sdk.dir=$ANDROID_SDK_ROOT" > android/local.properties

      - name: Sync launcher assets
        run: |
          set -e
          cd "$PROJECT_DIR"
          if [ -f index.html ] && [ -d config ]; then
            mkdir -p android/app/src/main/assets/config
            cp index.html android/app/src/main/assets/index.html
            cp config/servers.json android/app/src/main/assets/config/
            if [ -f config/update.json ]; then cp config/update.json android/app/src/main/assets/config/; fi
            echo "Assets synced"
          else
            echo "index.html/config not found, keeping assets already in the APK project"
          fi

      - name: Build debug APK
        run: |
          set -e
          cd "$PROJECT_DIR/android"
          if [ ! -f gradlew ]; then
            echo "gradlew missing, generating the wrapper"
            if ! command -v gradle > /dev/null; then
              echo "gradle CLI not found, downloading it"
              curl -sSL -o /tmp/gradle.zip https://services.gradle.org/distributions/gradle-8.5-bin.zip
              unzip -q /tmp/gradle.zip -d "$HOME/gradle-dist"
              export PATH="$HOME/gradle-dist/gradle-8.5/bin:$PATH"
            fi
            gradle wrapper --gradle-version 8.5
          fi
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: voidxen-launcher-debug
          path: ${{ env.PROJECT_DIR }}/android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: Attach APK to release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ env.PROJECT_DIR }}/android/app/build/outputs/apk/debug/*.apk
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
