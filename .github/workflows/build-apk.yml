name: Build APK

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    env:
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
      ANDROID_HOME: /usr/local/lib/android/sdk

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # GitHub's ubuntu runner already ships an Android SDK.
      # We only accept its licences and add the two packages we need.
      - name: Prepare Android SDK
        run: |
          set -e
          if [ ! -d "$ANDROID_SDK_ROOT" ]; then
            echo "SDK not found at $ANDROID_SDK_ROOT"; ls -la /usr/local/lib/android || true; exit 1
          fi
          SDKMANAGER="$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then
            SDKMANAGER="$(find "$ANDROID_SDK_ROOT" -name sdkmanager -type f | head -1)"
          fi
          echo "sdkmanager: $SDKMANAGER"
          yes | "$SDKMANAGER" --licenses > /dev/null 2>&1 || true
          "$SDKMANAGER" "platform-tools" "platforms;android-34" "build-tools;34.0.0" > /dev/null 2>&1 || true
          echo "sdk.dir=$ANDROID_SDK_ROOT" > android/local.properties

      - name: Sync launcher assets
        run: |
          mkdir -p android/app/src/main/assets/config
          cp index.html android/app/src/main/assets/index.html
          cp config/servers.json config/update.json android/app/src/main/assets/config/

      - name: Build debug APK
        working-directory: android
        run: |
          set -e
          if [ ! -f gradlew ]; then
            echo "gradlew missing, generating the wrapper"
            if ! command -v gradle > /dev/null; then
              echo "gradle CLI not found, downloading it"
              curl -sSL -o /tmp/gradle.zip https://services.gradle.org/distributions/gradle-8.5-bin.zip
              unzip -q /tmp/gradle.zip -d "$HOME/gradle-dist"
              export PATH="$HOME/gradle-dist/gradle-8.5/bin:$PATH"
            fi
            gradle wrapper --gradle-version 8.5
          fi
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: voidxen-launcher-debug
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: Attach APK to release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: android/app/build/outputs/apk/debug/*.apk
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
